<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PC Shop</title>
    <script type="text/javascript">
      // GitHub Pages serves only static files, so a direct hit on an Angular
      // route (e.g. /portfolio-pc-shop/components/graphics-cards) 404s at
      // the host level before the SPA ever loads. This redirects that 404
      // back to index.html with the original path packed into a query
      // string, which the decoder script in index.html unpacks via
      // history.replaceState before the Angular router boots.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep "/portfolio-pc-shop"

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
