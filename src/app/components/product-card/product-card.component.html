<a class="image" [class.unavailable]="!product().available" [routerLink]="detailLink()">
  @if (product().imageUrl) {
    <img [src]="product().imageUrl" [alt]="name()" />
  }
</a>

<div class="body">
  <a class="name" [routerLink]="detailLink()">{{ name() }}</a>

  <span class="availability" [class.unavailable]="!product().available">
    {{ product().available ? i18n.t('product.inStock') : i18n.t('product.unavailable') }}
  </span>

  <div class="footer">
    <span class="price">{{ formattedPrice() }}</span>
    <button class="add" type="button" [disabled]="!product().available" (click)="addToCart()">
      {{ i18n.t('product.addToCart') }}
    </button>
  </div>

  @if (isComparable()) {
    <label class="compare">
      <input
        type="checkbox"
        [checked]="compareService.isSelected(product().id)"
        [disabled]="!compareService.isSelected(product().id) && compareService.isFull()"
        (change)="toggleCompare()"
      />
      {{ i18n.t('compare.add') }}
    </label>
  }
</div>
