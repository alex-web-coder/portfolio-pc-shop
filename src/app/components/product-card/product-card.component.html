<div class="image" [class.unavailable]="!product().available">
  @if (product().imageUrl) {
    <img [src]="product().imageUrl" [alt]="product().name" />
  }
</div>

<div class="body">
  <span class="name">{{ product().name }}</span>

  <span class="availability" [class.unavailable]="!product().available">
    {{ product().available ? 'Auf Lager' : 'Nicht verfügbar' }}
  </span>

  <div class="footer">
    <span class="price">{{ formattedPrice() }}</span>
    <button class="add" type="button" [disabled]="!product().available">
      In den Warenkorb
    </button>
  </div>
</div>
