<div class="bar">
  <a class="brand" routerLink="/">
    <img class="brand-logo" src="/images/logo.jpeg" alt="" />
    <span class="brand-text">
      <span class="brand-name">Alex Web Coder's</span>
      <span class="brand-shop">PC Shop</span>
    </span>
  </a>

  <form class="search" role="search" (ngSubmit)="onSubmit()">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input
      type="search"
      [placeholder]="i18n.t('header.searchPlaceholder')"
      [value]="query()"
      (input)="onQueryInput($any($event.target).value)"
      (focus)="onFocus()"
    />

    @if (isDropdownOpen() && suggestions().length > 0) {
      <ul class="suggestions">
        @for (product of suggestions(); track product.id) {
          <li>
            <a [routerLink]="productLink(product)" (click)="onSuggestionSelected()">
              {{ productName(product) }}
            </a>
          </li>
        }
      </ul>
    }
  </form>

  <div class="actions">
    <button
      type="button"
      mat-icon-button
      [attr.aria-label]="themeService.theme() === 'dark' ? i18n.t('theme.switchToLight') : i18n.t('theme.switchToDark')"
      (click)="themeService.toggle()"
    >
      <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <div class="language-switch">
      <button
        type="button"
        class="lang-btn"
        [class.active]="i18n.language() === 'de'"
        [attr.aria-pressed]="i18n.language() === 'de'"
        [attr.aria-label]="i18n.t('language.switchToDe')"
        (click)="i18n.setLanguage('de')"
      >
        DE
      </button>
      <button
        type="button"
        class="lang-btn"
        [class.active]="i18n.language() === 'en'"
        [attr.aria-pressed]="i18n.language() === 'en'"
        [attr.aria-label]="i18n.t('language.switchToEn')"
        (click)="i18n.setLanguage('en')"
      >
        EN
      </button>
    </div>

    <a mat-icon-button routerLink="/profile" [attr.aria-label]="i18n.t('header.account')">
      <mat-icon>person_outline</mat-icon>
    </a>
    <a
      mat-icon-button
      routerLink="/cart"
      [attr.aria-label]="i18n.t('header.cart')"
      [matBadge]="cartService.itemCount()"
      [matBadgeHidden]="cartService.itemCount() === 0"
      matBadgeSize="small"
    >
      <mat-icon>shopping_cart</mat-icon>
    </a>
  </div>
</div>

<nav class="nav" aria-label="Hauptnavigation">
  @for (link of navLinks; track link.path) {
    <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">{{ i18n.t(link.labelKey) }}</a>
  }
</nav>
