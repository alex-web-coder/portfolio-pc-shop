<div class="bar">
  <a class="brand" routerLink="/">
    <span class="brand-name">Alex Web Coder's</span>
    <span class="brand-shop">PC Shop</span>
  </a>

  <label class="search">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input type="search" [placeholder]="i18n.t('header.searchPlaceholder')" />
  </label>

  <div class="actions">
    <div class="language-switch">
      <button
        type="button"
        class="lang-btn"
        [class.active]="i18n.language() === 'de'"
        [attr.aria-pressed]="i18n.language() === 'de'"
        [attr.aria-label]="i18n.t('language.switchToDe')"
        (click)="i18n.setLanguage('de')"
      >
        DE
      </button>
      <button
        type="button"
        class="lang-btn"
        [class.active]="i18n.language() === 'en'"
        [attr.aria-pressed]="i18n.language() === 'en'"
        [attr.aria-label]="i18n.t('language.switchToEn')"
        (click)="i18n.setLanguage('en')"
      >
        EN
      </button>
    </div>

    <a mat-icon-button routerLink="/profile" [attr.aria-label]="i18n.t('header.account')">
      <mat-icon>person_outline</mat-icon>
    </a>
    <a mat-icon-button routerLink="/cart" [attr.aria-label]="i18n.t('header.cart')" matBadge="0" matBadgeSize="small">
      <mat-icon>shopping_cart</mat-icon>
    </a>
  </div>
</div>

<nav class="nav" aria-label="Hauptnavigation">
  @for (link of navLinks; track link.path) {
    <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">{{ i18n.t(link.labelKey) }}</a>
  }
</nav>
