<div class="bar">
  <a class="brand" routerLink="/">
    <span class="brand-name">Alex Web Coder's</span>
    <span class="brand-shop">PC Shop</span>
  </a>

  <label class="search">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input type="search" placeholder="Produkte suchen" />
  </label>

  <div class="actions">
    <a mat-icon-button routerLink="/profile" aria-label="Konto">
      <mat-icon>person_outline</mat-icon>
    </a>
    <a mat-icon-button routerLink="/cart" aria-label="Warenkorb" matBadge="0" matBadgeSize="small">
      <mat-icon>shopping_cart</mat-icon>
    </a>
  </div>
</div>

<nav class="nav" aria-label="Hauptnavigation">
  @for (link of navLinks; track link.path) {
    <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
  }
</nav>
