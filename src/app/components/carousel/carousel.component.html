<div class="head">
  @if (heading()) {
    <h2>{{ heading() }}</h2>
  }
  <div class="controls">
    <button type="button" class="nav-btn" [attr.aria-label]="i18n.t('carousel.previous')" (click)="scrollBy(viewport, -1)">
      <span aria-hidden="true">&#8249;</span>
    </button>
    <button type="button" class="nav-btn" [attr.aria-label]="i18n.t('carousel.next')" (click)="scrollBy(viewport, 1)">
      <span aria-hidden="true">&#8250;</span>
    </button>
  </div>
</div>

<div
  class="viewport"
  #viewport
  tabindex="0"
  role="region"
  [attr.aria-label]="heading() ?? i18n.t('carousel.defaultLabel')"
  (keydown)="onKeydown($event, viewport)"
>
  <div class="track">
    <ng-content></ng-content>
  </div>
</div>
