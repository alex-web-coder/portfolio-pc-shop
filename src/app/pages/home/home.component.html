<section class="hero">
  <div class="hero-content">
    <p class="eyebrow">{{ i18n.t('home.hero.eyebrow') }}</p>
    <h1>{{ i18n.t('home.hero.title') }}</h1>
    <p class="lead">{{ i18n.t('home.hero.lead') }}</p>
    <div class="hero-actions">
      <a routerLink="/configurator" class="primary">{{ i18n.t('home.hero.configure') }}</a>
      <a routerLink="/components" class="secondary">{{ i18n.t('home.hero.discover') }}</a>
    </div>
  </div>
</section>

<section class="section">
  <app-carousel [heading]="i18n.t('home.categoriesHeading')">
    @for (category of categories(); track category.id) {
      <app-category-tile [category]="category" />
    }
  </app-carousel>
</section>

<section class="section">
  <app-carousel [heading]="i18n.t('home.productsHeading')">
    @for (product of products(); track product.id) {
      <app-product-card [product]="product" />
    }
  </app-carousel>
</section>
