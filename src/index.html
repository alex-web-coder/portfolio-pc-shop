<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PcShop</title>
    <script type="text/javascript">
      // Unpacks the path 404.html redirected here (see public/404.html) and
      // restores the real URL via history.replaceState before the Angular
      // router boots, so a direct hit on a deep route resolves correctly.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Fonts are self-hosted via @fontsource (see angular.json `styles`) — no Google Fonts requests. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
